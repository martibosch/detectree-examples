[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[project]
name = "detectree-examples"
version = "0.1.0"
description = "Example computational workflow using DetecTree"
authors = [{name = "Martí Bosch", email = "marti.bosch@epfl.ch"}]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.10"
dependencies = ["swisstopopy>=0.4"]

[project.urls]
Repository = "https://github.com/martibosch/detectree-examples"

[tool.codespell]
ignore-regex = '^\s*"image\/png":\s.*'
skip = "pixi.lock"

[tool.nbqa.addopts]
# ignore documentation errors in notebooks
ruff = ["--ignore=D"]

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
gdal = ">=3"
osmnx = ">=2.0.7,<3"
contextily = ">=1.7.0,<2"
ipykernel = ">=7.1.0,<8"
geopandas = ">=1.1.2,<2"
pdal = ">=2.9.3,<3"
ipywidgets = ">=8.1.8,<9"
snakemake = ">=9.16.3,<10"
click = "*"
pyqt = "*"

[tool.pixi.pypi-dependencies]
detectree = {version = ">=0.9.0,<0.10"}
detectree_examples = {path = ".", editable = true}

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["detectree_examples"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
  "F401"
]

[tool.uv.build-backend]
module-name = "detectree_examples"
module-root = ""
